# mergerfs config
branches=/tmp=RW,minfreespace=10G:/usr=RO:/nonexistent*=NC
mountpoint=/mnt/pool
category.create=mfs
func.getattr=newest
minfreespace=4G
cache.files=partial
cache.attr=120
fsname=pool
xattr=passthrough
inodecalc=path-hash
statfs=full
statfs-ignore=ro
moveonenospc=pfrd
link-exdev=rel-symlink
rename-exdev=passthrough
fuse_msg_size=256
read-thread-count=1
process-thread-count=4
umask=0022
